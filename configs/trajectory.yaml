# Active OCP cost, target tracking and solver parameters; all numerical values retained.
# Horizon/grid/integration: runtime.json physical.ocp; path limits: mission.yaml.
# Target tracking applies to the current decision interval in certified_flight/ocp.py.
# State/alpha scaling is numerical scaling, not a physical bound.
aero_target_tracking:
  enabled: true
  weight_CL: 1.0
  weight_CD: 1.0
  CL_scale: 0.1
  CD_scale: 0.03
objective:
  w_drag: 1.0
  w_heat: 0.5
  w_terminal: 5.0
  w_control_rate: 0.1
  w_range: 1.0
  reference:
    energy_ref: 1.0e9
    heat_load_ref: 5.0e7
  terminal:
    h_target: null
    V_target: null
    gamma_target: 0.0
    s_target: null
    weights:
      h: 0.0
      V: 0.0
      gamma: 1.0
      s: 0.0
    scales:
      h: 10000.0
      V: 1000.0
      gamma: 0.05
      s: 100000.0
solver:
  ipopt:
    max_iter: 1000
    tol: 1.0e-06
    acceptable_tol: 0.0001
    acceptable_iter: 10
    print_level: 0
    sb: 'yes'
    mu_strategy: adaptive
    hessian_approximation: limited-memory
    linear_solver: mumps
    max_cpu_time: 30.0
  scaling:
    h: 1.0e4
    V: 1.0e3
    gamma: 0.1
    s: 1.0e5
    alpha: 0.1
