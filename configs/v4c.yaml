# v4c (README_V4C.md): fixed-time target arrival (range D*, speed V* at 1200 s) flown on the CERTIFIED CHAIN (certified_flight:
# surrogate of the two-stage OCP, corrector, 30 s look-ahead, 0.1 s audit) with the F8D2000B library, the morph level chosen
# by the policy, and a truth plant with disturbances and the v3 model mismatch. Pure reinforcement learning (policy iteration
# with counterfactual labels, held-out acceptance), no comparison methods. Sizes are reduced for a 4-core run (a chain flight
# takes about a minute; a fast-model flight a quarter of a second). Selected with TARGET_RL_CONFIG=configs/v4c.yaml.
